name: float-self-serve

on:
  pull_request:
    paths:
      - ".github/workflows/float-self-serve.yml"
      - "app/api/float.ts"
      - "app/explorerRecovery.*"
      - "app/vercel.json"
      - "app/blockscoutExplorer.*"
      - "app/scripts/blockscout-explorer-web.test.ts"
      - "app/api/reasoning-x402.ts"
      - "app/api/treasury.ts"
      - "app/floatV2Config.d.ts"
      - "app/floatV2Config.js"
      - "app/floatV2Operations.d.ts"
      - "app/floatV2Operations.js"
      - "app/floatV2Operations.test.ts"
      - "app/leptonM1Config.d.ts"
      - "app/leptonM1Config.js"
      - "app/historicalReads.d.ts"
      - "app/historicalReads.js"
      - "app/arcTestnetNetwork.*"
      - "app/guardedTestnetDeployment.mjs"
      - "app/scripts/arc-testnet-network.test.mjs"
      - "agent/src/**"
      - "agent/package.json"
      - "agent/pnpm-lock.yaml"
      - "examples/float-v2-signed-spend/**"
      - "app/package.json"
      - "app/pnpm-lock.yaml"
      - "app/src/main.tsx"
      - "app/src/CircleWalletDiagnostic.tsx"
      - "app/src/CandidateFundingDesk.tsx"
      - "app/src/GatewayFunding.tsx"
      - "app/src/gatewayFundingGuard.ts"
      - "app/src/CircleAgentHandoff.tsx"
      - "app/src/circleAgentCommands.ts"
      - "app/scripts/circle-agent-*"
      - "app/scripts/circle-cli-*"
      - "tooling/circle-cli-runtime/**"
      - "app/scripts/gateway-reserve*"
      - "app/scripts/public-testnet-observer*"
      - "ops/public-testnet-observer/**"
      - "app/scripts/shadow-circle-agent.mjs"
      - "app/scripts/shadow-circle-guarded-testnet.mjs"
      - "app/src/savedTransactionLookup.ts"
      - "app/src/lineRefresh.ts"
      - "app/scripts/line-refresh.test.ts"
      - "app/scripts/saved-transaction-lookup.test.ts"
      - "app/scripts/gateway-funding-guard.test.ts"
      - "app/src/candidateFunding.ts"
      - "app/src/selfServicePurchase.mjs"
      - "app/src/boundedResponse.mjs"
      - "ops/mainnet-runtime/**"
      - "app/src/selfServicePurchase.d.mts"
      - "app/src/PublicPurchase.tsx"
      - "app/src/publicTestnet.ts"
      - "app/src/guardedMainnet.ts"
      - "app/src/guardedTestnet.ts"
      - "app/guardedTestnetDeployment.d.mts"
      - "contracts/deployments/public-testnet/**"
      - "app/scripts/self-service-purchase*.test.mjs"
      - "app/scripts/shadow-v2-cycle-service.test.mjs"
      - "app/src/candidateFunding.css"
      - "app/src/walletCandidateProbePayload.ts"
      - "app/src/walletPayableIntent.ts"
      - "app/src/walletDiagnosticPayload.ts"
      - "app/src/circleWalletDiagnostic.css"
      - "app/src/styles.css"
      - "app/scripts/lepton-readiness.test.mjs"
      - "app/scripts/historical-reads.test.mjs"
      - "app/scripts/float-history-api.test.ts"
      - "app/scripts/treasury-history-api.test.ts"
      - "app/scripts/treasury-verify-live.mjs"
      - "app/scripts/treasury-verify-live.test.mjs"
      - "app/scripts/float-mainnet-*"
      - "app/scripts/rpc-read-queue*"
      - "app/scripts/rpc-read-transport*"
      - "examples/float-mainnet-provider-server/**"
      - "app/scripts/shadow-url-migration.test.mjs"
      - "app/scripts/circle-candidate-probe.test.mjs"
      - "app/scripts/circle-payable-intent.test.mjs"
      - "app/scripts/circle-wallet-diagnostic.test.ts"
      - "app/scripts/reasoning-x402-availability.test.mjs"
      - "app/scripts/shadow-reasoning-service.test.mjs"
      - "app/scripts/shadow-arc-wallet-service.test.mjs"
      - "app/shadowUrls.d.ts"
      - "app/shadowUrls.js"
      - "app/tsconfig.json"
      # forge build compiles the shared Solidity sources and test fixtures too.
      - "contracts/**"
      - "docs/MAINNET_PATH.md"
      - "docs/SHADOW_FLOAT_MAINNET_SPEC.md"
      - "docs/SHADOW_FLOAT_MAINNET_TEST_MATRIX.md"
      - "docs/SHADOW_FLOAT_MAINNET_THREAT_MODEL.md"
      - "docs/SHADOW_FLOAT_MAINNET_*.md"
      - "docs/PILOT_OPERATIONS.md"
      - "docs/PILOT_RECRUITMENT.md"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mainnet-tooling-gate:
    runs-on: ubuntu-latest
    # Linux compilation plus the full serial fault/recovery suite exceeded 20m.
    # Preserve every assertion; allow the complete gate to finish.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          # Deployment tests verify the pinned source commit's blobs.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Build local contract artifacts
        run: forge build --root contracts
      - name: Test immutable candidate contracts and draw-bound repayment
        run: npm run contracts:mainnet:test
      - name: Test all candidate tooling against local Anvil
        # The glob includes new provider, evidence, review and pilot suites as
        # they land. Run serially because the suites use fixed local RPC ports.
        run: npm run float:mainnet:all-tools:test
      - name: Test provider store rollback and crash holds
        run: node --test app/scripts/provider-store-witness.test.mjs
      - name: Test public testnet observer failure and recovery
        run: node --test app/scripts/public-testnet-observer.test.mjs app/scripts/public-testnet-observer-alerts.test.mjs
      - name: Test candidate funding and browser transaction recovery
        run: node --test --test-concurrency=1 app/scripts/float-mainnet-browser.test.ts app/scripts/float-mainnet-guarded-browser.test.ts
      - name: Test public testnet self-registration and wallet purchases
        run: |
          forge test --root contracts --match-path 'test/ShadowFloatPublicTestnet*.t.sol'
          node --test --test-concurrency=1 app/scripts/self-service-purchase*.test.mjs app/scripts/shadow-v2-cycle-service.test.mjs
      - name: Test saved transaction hash lookup
        run: node --test app/scripts/saved-transaction-lookup.test.ts app/scripts/gateway-funding-guard.test.ts app/scripts/line-refresh.test.ts
      - name: Test the shared RPC read queue
        run: node --test app/scripts/rpc-read-queue.test.mjs

  self-serve-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Test operational alert semantics
        run: |
          npm run float:v2-ops:test
          node --test --test-concurrency=1 app/scripts/float-mainnet-monitor-alerts.test.mjs app/scripts/guarded-testnet-monitor-alerts.test.mjs
      - name: Test Lepton readiness and historical proof fallback
        run: npm run lepton:readiness:test
      - name: Test historical explorer retries, deadlines and empty histories
        run: node --test app/scripts/historical-reads.test.mjs app/scripts/float-history-api.test.ts app/scripts/treasury-history-api.test.ts app/scripts/blockscout-explorer-web.test.ts
      - name: Test Treasury CLI JSON reports and exit status
        run: node --test app/scripts/treasury-verify-live.test.mjs
      - name: Test domain migration and mandate identity compatibility
        run: node --test app/scripts/shadow-url-migration.test.mjs
      - name: Test public Arc testnet wallet settings and RPC repair guidance
        run: node --test app/scripts/arc-testnet-network.test.mjs
      - name: Install agent dependencies
        working-directory: agent
        run: pnpm install --frozen-lockfile --ignore-workspace
      - name: Typecheck testnet agent RPC consumers
        run: pnpm --dir agent exec tsc --noEmit
      - name: Test Circle wallet diagnostic and bounded candidate signing payloads
        run: node --test app/scripts/circle-wallet-diagnostic.test.ts app/scripts/circle-candidate-probe.test.mjs app/scripts/circle-payable-intent.test.mjs
      - name: Test Gateway reserve intent and recovery boundaries
        run: node --test app/scripts/gateway-reserve*.test.mjs
      - name: Install the approved Circle runtime without lifecycle scripts
        run: npx --yes --package=npm@11.19.0 npm ci --prefix tooling/circle-cli-runtime --ignore-scripts --no-audit --no-fund
      - name: Test Circle Agent Wallet execution and durable recovery journal
        run: node --test app/scripts/circle-agent-*.test.mjs
      - name: Test reasoning availability before payment and provider acceptance
        run: node --test app/scripts/reasoning-x402-availability.test.mjs app/scripts/shadow-reasoning-service.test.mjs app/scripts/shadow-arc-wallet-service.test.mjs
      - name: Typecheck app and API
        run: npm run app:typecheck
      - name: Build production app
        run: npm run app:build
      - name: Build opt-in guarded mainnet participant candidate
        run: VITE_SHADOW_GUARDED_MAINNET_CANDIDATE=true npm run app:build
      - name: Build opt-in guarded testnet funding with Gateway enabled elsewhere
        run: VITE_SHADOW_GUARDED_TESTNET_CANDIDATE=true VITE_SHADOW_GATEWAY_TESTNET=true npm run app:build
      - name: Build opt-in Gateway browser candidate
        run: VITE_SHADOW_GATEWAY_TESTNET=true npm run app:build

  # Packet C implementation evidence only. This job must not be used to
  # qualify deployment or release; those gates require official Arc mainnet
  # parameters, a deterministic manifest, and an authorized owner handoff.
  mainnet-implementation-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Match the locally verified candidate toolchain; avoid floating upgrades.
          version: v1.7.1
      - name: Test sponsored-only Mainnet V1 candidate
        run: forge test --root contracts --match-path 'test/ShadowFloatMainnet*.t.sol'
      - name: Enforce implementation runtime and scope locks
        run: node contracts/test/mainnet-scope.test.mjs
