name: provider-worker-runtime
on:
  pull_request:
    paths:
      - 'packages/provider-worker-runtime/**'
      - 'packages/monitor-worker-runtime/**'
      - 'packages/provider-durable-store/**'
      - 'packages/rpc-read-websocket/**'
      - 'examples/float-mainnet-provider-server/**'
      - 'app/scripts/float-mainnet-*.mjs'
      - 'app/scripts/rpc-read-*.mjs'
      - 'app/scripts/arc-rpc-*.mjs'
      - 'app/pnpm-lock.yaml'
      - '.github/workflows/provider-worker-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'packages/provider-worker-runtime/**'
      - 'packages/monitor-worker-runtime/**'
      - 'packages/provider-durable-store/**'
      - 'packages/rpc-read-websocket/**'
      - 'examples/float-mainnet-provider-server/**'
      - 'app/scripts/float-mainnet-*.mjs'
      - 'app/scripts/rpc-read-*.mjs'
      - 'app/scripts/arc-rpc-*.mjs'
      - 'app/pnpm-lock.yaml'
      - '.github/workflows/provider-worker-runtime.yml'
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-foundry
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: npm ci --prefix packages/provider-worker-runtime
      - run: pnpm --dir app install --frozen-lockfile --ignore-scripts
      - name: Cache the pinned Solidity compiler
        run: forge build --root contracts src/ShadowFloatMainnetPublicSettled.sol
      - name: Verify recovery deadlines against the local settled contract
        run: npm --prefix packages/provider-worker-runtime run test:recovery-deadline

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/provider-worker-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/provider-worker-runtime/package-lock.json
      - run: npm ci
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm --dir ../../app install --frozen-lockfile --ignore-scripts
      - run: npm run check

  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/monitor-worker-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/monitor-worker-runtime/package-lock.json
      - run: npm ci
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm --dir ../../app install --frozen-lockfile --ignore-scripts
      - run: npm run check
