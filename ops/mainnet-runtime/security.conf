# Drop-in for the provider, observer and one-shot alerts service. Keep their
# existing users, environment files, journals, baselines and write paths.
[Service]
NoNewPrivileges=true
CapabilityBoundingSet=
AmbientCapabilities=
RestrictSUIDSGID=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
LockPersonality=true
